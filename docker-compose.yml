version: '3.8'

services:
  # Sidecar PO Token Provider — WAJIB ada agar YouTube tidak memblokir di VPS/datacenter IP.
  # Jalankan ini bersama bot. Tidak perlu config tambahan.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
    ports:
      - "4416:4416"

  linkryn-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkryn-bot
    restart: unless-stopped
    depends_on:
      - bgutil-provider
    env_file:
      - .env
    environment:
      # URL internal Docker network ke sidecar bgutil — jangan diubah
      - BGUTIL_PROVIDER_URL=http://bgutil-provider:4416
    volumes:
      # Pasang cookies.txt jika tersedia (opsional)
      # Hapus 2 baris di bawah jika tidak punya cookies.txt
      - ./cookies.txt:/app/cookies.txt:ro
    ports:
      - "5000:5000"

  linkryn-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: linkryn-web
    restart: unless-stopped
    ports:
      - "4173:4173"
